name: Integracao painel escolar

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: baixar codigo
        uses: actions/checkout@v4

      - name: versao python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: build check
        run: python -m compileall app/
